<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vector-index · HNSW 与 IVF-PQ 对照实验</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --line:#30363d;
  --fg:#e6edf3; --dim:#8b949e; --dim2:#6e7681;
  --acc:#58a6ff; --ok:#3fb950; --warn:#d29922; --err:#f85149;
  --purple:#bc8cff; --cyan:#39c5cf; --pink:#f778ba;
  --mono:'SF Mono',Consolas,'Liberation Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:14px; line-height:1.6; padding:24px 20px 60px;
}
.wrap{max-width:1360px;margin:0 auto}
header{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
h1{font-size:22px;font-weight:600;letter-spacing:.3px}
h1 .ver{color:var(--dim2);font-size:13px;font-weight:400;margin-left:8px}
.sub{color:var(--dim);font-size:13px;margin-top:6px;max-width:920px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.badge{background:var(--panel2);border:1px solid var(--line);border-radius:20px;
  padding:3px 11px;font-size:12px;color:var(--dim);font-family:var(--mono)}
.badge b{color:var(--acc);font-weight:600}
#healthDot{display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--dim2);margin-right:6px;vertical-align:middle}
#healthDot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
#healthDot.bad{background:var(--err)}

section{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:16px 18px;margin-bottom:16px}
h2{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:9px}
h2 .num{background:var(--acc);color:#0d1117;width:21px;height:21px;border-radius:4px;
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
h3{font-size:13px;font-weight:600;color:var(--dim);margin:14px 0 8px;
  text-transform:uppercase;letter-spacing:.6px}

.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.field{display:flex;flex-direction:column;gap:4px}
label{font-size:12px;color:var(--dim)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:5px;
  color:var(--fg);padding:6px 9px;font-size:13px;font-family:var(--mono);width:100%}
input:focus,select:focus{outline:none;border-color:var(--acc)}
button{background:var(--acc);color:#0d1117;border:none;border-radius:5px;
  padding:7px 15px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
button:hover{filter:brightness(1.12)}
button:disabled{opacity:.45;cursor:not-allowed;filter:none}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
button.ghost:hover{border-color:var(--acc);color:var(--acc);background:transparent}
.row{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap;margin-top:12px}

table{width:100%;border-collapse:collapse;font-size:13px;font-family:var(--mono)}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
td.n,th.n{text-align:right}
tbody tr:hover{background:var(--panel2)}
.good{color:var(--ok)} .mid{color:var(--warn)} .bad{color:var(--err)}
.muted{color:var(--dim2)}

.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:11px 13px}
.card .t{font-size:12px;color:var(--dim)}
.card .v{font-size:21px;font-weight:600;font-family:var(--mono);margin-top:2px}
.card .d{font-size:11px;color:var(--dim2);margin-top:2px}

pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;
  padding:11px 13px;overflow:auto;font-family:var(--mono);font-size:12px;
  line-height:1.55;max-height:420px;color:var(--fg)}
pre::-webkit-scrollbar{width:8px;height:8px}
pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

.note{background:var(--panel2);border-left:3px solid var(--acc);
  padding:9px 13px;font-size:12.5px;color:var(--dim);border-radius:0 5px 5px 0;margin-top:11px}
.note.warn{border-left-color:var(--warn)}
.note.ok{border-left-color:var(--ok)}
.note b{color:var(--fg)}
.note code{font-family:var(--mono);color:var(--cyan);font-size:12px}

.bars{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bar{display:grid;grid-template-columns:110px 1fr 92px;gap:9px;align-items:center;font-size:12px}
.bar .lab{font-family:var(--mono);color:var(--dim)}
.bar .track{background:var(--bg);border-radius:3px;height:16px;overflow:hidden;position:relative}
.bar .fill{height:100%;background:var(--acc);transition:width .35s ease}
.bar .fill.hnsw{background:var(--ok)} .bar .fill.ivfpq{background:var(--purple)}
.bar .val{text-align:right;font-family:var(--mono);color:var(--fg)}

#svgBox{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;margin-top:10px}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
  border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;
  vertical-align:middle;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
#toast{position:fixed;right:18px;bottom:18px;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:6px;
  padding:11px 15px;max-width:420px;font-size:13px;z-index:99;
  box-shadow:0 6px 22px rgba(0,0,0,.5)}
#toast.err{border-left-color:var(--err)} #toast.ok{border-left-color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>vector-index<span class="ver" id="verTxt"></span></h1>
  <div class="sub">
    从零实现 HNSW（分层图）与 IVF-PQ（倒排 + 乘积量化），
    并把「召回率 / 构建耗时 / 内存 / 延迟」四组数字放在同一张表里对照。
    所有索引的距离计算、层数采样、邻居剪枝、量化编码都在 Python 里逐行可见。
  </div>
  <div class="badges">
    <span class="badge">健康 <span id="healthDot"></span><b id="healthTxt">检测中</b></span>
    <span class="badge">数据集 <b id="cntDs">0</b></span>
    <span class="badge">当前 <b id="curDs">—</b></span>
    <span class="badge">引擎 <b id="curEng">—</b></span>
  </div>
</header>

<!-- 1. 建库 -->
<section>
  <h2><span class="num">1</span>生成数据集</h2>
  <div class="grid">
    <div class="field"><label>数量 count</label><input id="pCount" type="number" value="1000" min="20" max="20000"></div>
    <div class="field"><label>维度 dim</label><input id="pDim" type="number" value="32" min="2" max="512"></div>
    <div class="field"><label>度量</label><select id="pMetric"><option value="l2">l2（欧氏）</option><option value="cosine">cosine（余弦）</option><option value="inner">inner（内积）</option></select></div>
    <div class="field"><label>结构</label><select id="pKind"><option value="clustered">clustered（分簇）</option><option value="uniform">uniform（均匀）</option><option value="gaussian">gaussian（单高斯）</option><option value="duplicates">duplicates（大量并列）</option></select></div>
    <div class="field"><label>簇数</label><input id="pClusters" type="number" value="24" min="1"></div>
    <div class="field"><label>重叠 overlap</label><input id="pOverlap" type="number" value="0.15" step="0.05" min="0.01"></div>
    <div class="field"><label>随机种子</label><input id="pSeed" type="number" value="42"></div>
  </div>
  <div class="row">
    <button id="btnDs">生成</button>
    <span class="muted" style="font-size:12px">固定 seed + 固定构造顺序 ⇒ 结果可复现</span>
  </div>
  <div id="dsOut" class="hidden" style="margin-top:11px"></div>
</section>

<!-- 2. 建索引 -->
<section>
  <h2><span class="num">2</span>构建索引</h2>
  <div class="grid">
    <div class="field"><label>引擎</label><select id="pEngine">
      <option value="hnsw">HNSW（图索引）</option>
      <option value="ivfpq">IVF-PQ（量化）</option>
    </select></div>
    <div class="field"><label id="labP1">m（邻居数）</label><input id="p1" type="number" value="16" min="2"></div>
    <div class="field"><label id="labP2">ef_construction</label><input id="p2" type="number" value="100" min="1"></div>
    <div class="field"><label id="labP3">ef_search</label><input id="p3" type="number" value="64" min="1"></div>
  </div>
  <div class="row"><button id="btnIdx">构建</button></div>
  <div id="idxOut" class="hidden" style="margin-top:11px"></div>
  <div class="note" id="engineNote"></div>
</section>

<!-- 3. 单次检索 -->
<section>
  <h2><span class="num">3</span>单次检索对比</h2>
  <div class="grid">
    <div class="field"><label>查询源序号</label><input id="sProbe" type="number" value="0" min="0"></div>
    <div class="field"><label>k</label><input id="sK" type="number" value="10" min="1" max="100"></div>
    <div class="field"><label>ef_search 覆盖</label><input id="sEf" type="number" placeholder="留空用默认值"></div>
    <div class="field"><label>nprobe 覆盖</label><input id="sNprobe" type="number" placeholder="留空用默认值"></div>
  </div>
  <div class="row"><button id="btnSearch">检索</button></div>
  <div id="searchOut" class="hidden" style="margin-top:11px"></div>
</section>

<!-- 4. 基准 -->
<section>
  <h2><span class="num">4</span>基准评测（三引擎对照）</h2>
  <div class="grid">
    <div class="field"><label>count</label><input id="bCount" type="number" value="1000" min="20" max="20000"></div>
    <div class="field"><label>dim</label><input id="bDim" type="number" value="32" min="2" max="512"></div>
    <div class="field"><label>k</label><input id="bK" type="number" value="10" min="1"></div>
    <div class="field"><label>查询数</label><input id="bQ" type="number" value="30" min="1"></div>
    <div class="field"><label>PQ nbits</label><input id="bNbits" type="number" value="4" min="1" max="8"></div>
    <div class="field"><label>seed</label><input id="bSeed" type="number" value="42"></div>
  </div>
  <div class="row">
    <button id="btnBench">跑基准</button>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)">
      <input type="checkbox" id="bSweep" checked style="width:auto"> 扫描 ef / nprobe 曲线
    </label>
  </div>
  <div id="benchOut" class="hidden" style="margin-top:11px"></div>
</section>

<!-- 5. 可视化 -->
<section>
  <h2><span class="num">5</span>曲线与结构</h2>
  <div class="tabs row" style="margin-top:0;margin-bottom:10px">
    <button class="ghost" data-tab="recall">召回率–延迟</button>
    <button class="ghost" data-tab="memory">内存构成</button>
    <button class="ghost" data-tab="layers">HNSW 分层</button>
  </div>
  <div id="svgBox"><svg id="svg" width="100%" height="320" viewBox="0 0 900 320"></svg></div>
  <div class="note">图上的点来自上面第 <b>2 / 4</b> 步的真实返回值，不是示意图。</div>
</section>

<footer style="color:var(--dim2);font-size:12px;text-align:center;margin-top:26px">
  纯 Python 标准库实现核心算法 · FastAPI 仅用于 HTTP 层
</footer>
</div>
<div id="toast" class="hidden"></div>

<script>
const $ = (s) => document.querySelector(s);
// snapshots 按**引擎**分开放而不是共用一个。
// 共用一个的结果：先建 HNSW 再建 IVF-PQ 之后，"HNSW 分层"那张图
// 就变成提示"请先构建 HNSW 索引"了 —— 数据其实还在，
// 只是被后来的引擎覆盖掉了。两个引擎的快照要能并存对照，
// 这正是这个页面存在的意义。
const state = { datasetId:null, engine:null, snapshots:{}, bench:null, tab:'recall' };

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, kind='') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = kind;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 5000);
}

/* ---------- 格式化 ---------- */
const fmtMs = (v) => v >= 10 ? v.toFixed(1) : v >= 1 ? v.toFixed(2) : v.toFixed(3);
const fmtPct = (v) => (v * 100).toFixed(2) + '%';
const fmtKB = (b) => b >= 1048576 ? (b/1048576).toFixed(2)+' MB' : (b/1024).toFixed(1)+' KB';
const recallClass = (v) => v >= 0.98 ? 'good' : v >= 0.85 ? 'mid' : 'bad';

/* ---------- 健康检查 ---------- */
async function checkHealth() {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    $('#healthTxt').textContent = r.ok ? '正常' : '异常';
    $('#healthDot').className = 'on';
    $('#verTxt').textContent = 'v' + d.version;
    $('#cntDs').textContent = d.dataset_count;
    await loadOptions();
  } catch (e) {
    $('#healthTxt').textContent = '离线';
    $('#healthDot').className = 'bad';
  }
}

async function loadOptions() {
  const d = await (await fetch('/api/options')).json();
  $('#pCount').min = d.bounds.count[0]; $('#pCount').max = d.bounds.count[1];
  $('#pDim').min   = d.bounds.dim[0];   $('#pDim').max   = d.bounds.dim[1];
  // 后端新增/移除度量时，前端跟着更新而不是各写一份各的
  const sel = $('#pMetric');
  const keep = sel.value;
  sel.innerHTML = d.metrics.map(m =>
    `<option value="${m}">${m === 'l2' ? 'l2（欧氏）' : m === 'cosine' ? 'cosine（余弦）' : 'inner（内积）'}</option>`
  ).join('');
  if (d.metrics.includes(keep)) sel.value = keep;
  const ks = $('#pKind');
  ks.innerHTML = d.kinds.map(k => `<option value="${k}">${k}</option>`).join('');
}

/* ---------- 1. 数据集 ---------- */
$('#btnDs').onclick = async () => {
  const btn = $('#btnDs');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>生成中';
  try {
    const r = await fetch('/api/dataset', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        count:+ $('#pCount').value, dim:+ $('#pDim').value,
        metric:$('#pMetric').value, kind:$('#pKind').value,
        seed:+ $('#pSeed').value, n_clusters:+ $('#pClusters').value,
        overlap:+ $('#pOverlap').value,
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || JSON.stringify(d));
    state.datasetId = d.id;
    state.engine = null; state.snapshots = {};
    $('#curDs').textContent = d.id;
    $('#curEng').textContent = '—';
    renderDataset(d);
    toast('数据集已生成：' + d.id, 'ok');
  } catch (e) { toast('生成失败：' + e.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = '生成'; }
};

function renderDataset(d) {
  const ds = d.dataset;
  const rows = Object.entries(ds.params || {}).map(([k,v]) =>
    `<tr><td>${k}</td><td class="n">${Array.isArray(v)?JSON.stringify(v):v}</td></tr>`).join('');
  $('#dsOut').classList.remove('hidden');
  $('#dsOut').innerHTML = `
    <div class="cards">
      <div class="card"><div class="t">数据集 ID</div><div class="v" style="font-size:16px">${d.id}</div></div>
      <div class="card"><div class="t">点 × 维度</div><div class="v">${ds.count} × ${ds.dim}</div></div>
      <div class="card"><div class="t">向量本体内存</div><div class="v">${fmtKB(d.vector_bytes)}</div>
        <div class="d">array('f') 紧凑存储</div></div>
      <div class="card"><div class="t">revision</div><div class="v">${d.store_revision}</div>
        <div class="d">索引据此判断过期</div></div>
    </div>
    <h3>生成参数</h3>
    <table><tbody>
      <tr><td>kind</td><td class="n">${ds.kind}</td></tr>
      <tr><td>metric</td><td class="n">${ds.metric}</td></tr>
      <tr><td>seed</td><td class="n">${ds.seed}</td></tr>
      ${rows}
    </tbody></table>`;
}

/* ---------- 2. 索引 ---------- */
$('#pEngine').onchange = syncIndexFields;
function syncIndexFields() {
  const eng = $('#pEngine').value;
  if (eng === 'hnsw') {
    $('#labP1').textContent = 'm（每层邻居数）';        $('#p1').value = 16;
    $('#labP2').textContent = 'ef_construction';        $('#p2').value = 100;
    $('#labP3').textContent = 'ef_search';              $('#p3').value = 64;
    $('#engineNote').innerHTML =
      'HNSW 的节点层数按<b>几何分布</b>采样：设 <code>m</code> 后，'
      + '每上升一层节点数约为 <code>1/m</code>。第 0 层邻居上限 <code>2m</code>，'
      + '上层只有 <code>m</code> —— 上层只需找对方向，堆边纯属浪费内存。'
      + '查询期的 <code>ef_search</code> 是<b>唯一的精度旋钮</b>，不用重建索引。';
  } else {
    $('#labP1').textContent = 'nlist（倒排表数）'; $('#p1').value = 16;
    $('#labP2').textContent = 'm（子空间数）';     $('#p2').value = 8;
    $('#labP3').textContent = 'nbits（每子空间位数）'; $('#p3').value = 4;
    $('#engineNote').innerHTML =
      'IVF-PQ <b>不保存原始向量</b>：每个向量被压成 <code>m</code> 个字节。'
      + '查询时只扫 <code>nprobe</code> 个倒排表，距离用<b>查表法</b>（ADC）算，'
      + '不必还原向量。代价是量化误差 —— <b>召回率有上限</b>，'
      + '调 nprobe 只能接近它，不能突破。';
  }
}

$('#btnIdx').onclick = async () => {
  if (!state.datasetId) return toast('请先生成数据集', 'err');
  const btn = $('#btnIdx');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>构建中';
  const eng = $('#pEngine').value;
  try {
    const params = eng === 'hnsw'
      ? { m:+$('#p1').value, ef_construction:+$('#p2').value, ef_search:+$('#p3').value }
      : { nlist:+$('#p1').value, m:+$('#p2').value, nbits:+$('#p3').value };
    const r = await fetch('/api/index/' + state.datasetId, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ engine:eng, params })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || JSON.stringify(d));
    state.engine = eng;
    state.snapshots[eng] = d.snapshot;
    $('#curEng').textContent = eng;
    renderIndex(d);
    draw();
    toast(`${eng} 索引构建完成，耗时 ${d.build_wall_seconds}s`, 'ok');
  } catch (e) { toast('构建失败：' + e.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = '构建'; }
};

function renderIndex(d) {
  const s = d.snapshot;
  let extra = '';
  if (d.engine === 'hnsw') {
    extra = `
      <div class="card"><div class="t">层数</div><div class="v">${s.levels}</div>
        <div class="d">节点/层 [${s.nodes_per_level.join(', ')}]</div></div>
      <div class="card"><div class="t">第0层平均度</div><div class="v">${s.avg_degree_layer0}</div>
        <div class="d">上限 ${s.config.m0}</div></div>
      <div class="card"><div class="t">每次查询距离计算</div><div class="v">${s.avg_distance_per_query || 0}</div>
        <div class="d">已扣除构建期的开销</div></div>`;
  } else {
    const ls = s.list_sizes;
    extra = `
      <div class="card"><div class="t">倒排表数</div><div class="v">${s.nlist}</div>
        <div class="d">空表 ${ls.empty} 个</div></div>
      <div class="card"><div class="t">每表平均点数</div><div class="v">${ls.avg}</div>
        <div class="d">最小 ${ls.min} / 最大 ${ls.max}</div></div>
      <div class="card"><div class="t">每次查询扫描</div><div class="v">${s.avg_scanned_per_query}</div>
        <div class="d">nprobe = ${s.config.nprobe}</div></div>`;
  }
  const mem = s.memory || {};
  $('#idxOut').classList.remove('hidden');
  $('#idxOut').innerHTML = `
    <div class="cards">
      <div class="card"><div class="t">构建耗时</div><div class="v">${fmtMs(d.build_wall_seconds*1000)}<span style="font-size:13px"> ms</span></div></div>
      ${extra}
      <div class="card"><div class="t">索引内存</div><div class="v">${fmtKB(mem.total||0)}</div>
        <div class="d">${Object.entries(mem).filter(([k])=>k!=='total').map(([k,v])=>`${k} ${fmtKB(v)}`).join(' · ') || '—'}</div></div>
    </div>
    <details style="margin-top:11px"><summary style="cursor:pointer;color:var(--dim);font-size:12px">完整快照</summary>
      <pre>${JSON.stringify(s, null, 1)}</pre></details>`;
}

/* ---------- 3. 检索 ---------- */
$('#btnSearch').onclick = async () => {
  if (!state.datasetId) return toast('请先生成数据集', 'err');
  if (!state.engine)    return toast('请先构建索引', 'err');
  const btn = $('#btnSearch');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>检索中';
  try {
    const body = {
      dataset_id: state.datasetId, engine: state.engine,
      k: +$('#sK').value, probe_index: +$('#sProbe').value,
    };
    if ($('#sEf').value)     body.ef_search = +$('#sEf').value;
    if ($('#sNprobe').value) body.nprobe    = +$('#sNprobe').value;
    const r = await fetch('/api/search', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || JSON.stringify(d));
    renderSearch(d);
  } catch (e) { toast('检索失败：' + e.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = '检索'; }
};

function renderSearch(d) {
  const rows = d.exact.keys.map((k, i) => {
    const inAnn = d.ann.keys.indexOf(k);
    const annDist = inAnn >= 0 ? d.ann.distances[inAnn] : null;
    return `<tr>
      <td class="n">${i+1}</td>
      <td>${d.exact.labels[i]}</td>
      <td class="n">${d.exact.distances[i]}</td>
      <td class="n">${inAnn >= 0 ? '<span class="good">第 '+(inAnn+1)+' 名</span>' : '<span class="bad">未召回</span>'}</td>
      <td class="n">${annDist === null ? '—' : annDist}</td>
    </tr>`;
  }).join('');
  const gap = d.recall < 0.999 && d.threshold_recall > d.recall + 0.05;
  $('#searchOut').classList.remove('hidden');
  $('#searchOut').innerHTML = `
    <div class="cards">
      <div class="card"><div class="t">标准召回率</div>
        <div class="v ${recallClass(d.recall)}">${fmtPct(d.recall)}</div>
        <div class="d">集合交集 / k</div></div>
      <div class="card"><div class="t">门槛召回率</div>
        <div class="v ${recallClass(d.threshold_recall)}">${fmtPct(d.threshold_recall)}</div>
        <div class="d">距离 ≤ 第 k 名门槛</div></div>
      <div class="card"><div class="t">ANN 延迟</div><div class="v">${fmtMs(d.latency.ann_ms)}<span style="font-size:13px"> ms</span></div>
        <div class="d">暴力 ${fmtMs(d.latency.exact_ms)} ms · 加速 ${d.latency.speedup}×</div></div>
      <div class="card"><div class="t">查询来源</div><div class="v" style="font-size:15px">${d.probe_label}</div>
        <div class="d">k=${d.k}${Object.keys(d.overrides).length?' · 覆盖 '+JSON.stringify(d.overrides):''}</div></div>
    </div>
    ${gap ? `<div class="note warn">两种召回率差了 ${((d.threshold_recall-d.recall)*100).toFixed(1)} 个百分点。
      这是<b>正常现象</b>而不是 bug：数据里存在大量近乎重合的近邻，
      标准召回率按"集合是否完全一致"计分，索引选了等距的另一个点就被判失分；
      门槛召回率只看距离够不够近，于是给了高分。
      <b>并列多的数据集上应当以门槛召回率为准。</b></div>` : ''}
    <h3>精确 top-${d.k} 与 ANN 命中情况</h3>
    <table><thead><tr>
      <th class="n">名次</th><th>label</th><th class="n">精确距离</th>
      <th class="n">ANN 是否召回</th><th class="n">ANN 距离</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------- 4. 基准 ---------- */
$('#btnBench').onclick = async () => {
  const btn = $('#btnBench');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>评测中（需要几秒）';
  try {
    const body = {
      count:+$('#bCount').value, dim:+$('#bDim').value, k:+$('#bK').value,
      n_queries:+$('#bQ').value, seed:+$('#bSeed').value,
      ivfpq_nbits:+$('#bNbits').value, sweep:$('#bSweep').checked,
    };
    const r = await fetch('/api/benchmark', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || JSON.stringify(d));
    state.bench = d;
    renderBench(d);
    draw();
    toast('基准完成，总耗时 ' + d.result.elapsed_seconds + 's', 'ok');
  } catch (e) { toast('评测失败：' + e.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = '跑基准'; }
};

function renderBench(d) {
  const res = d.result;
  const rows = res.engines.map(e => {
    const cls = recallClass(e.recall);
    return `<tr>
      <td>${e.label}</td>
      <td class="n ${cls}">${fmtPct(e.recall)}</td>
      <td class="n ${cls}">${fmtPct(e.threshold_recall)}</td>
      <td class="n">${fmtMs(e.build_seconds*1000)}</td>
      <td class="n">${fmtMs(e.latency.mean_ms)}</td>
      <td class="n">${fmtMs(e.latency.p95_ms)}</td>
      <td class="n">${fmtMs(e.latency.p99_ms)}</td>
      <td class="n">${Math.round(e.latency.qps)}</td>
      <td class="n">${Math.round(e.scanned_per_query)}</td>
      <td class="n">${fmtKB(e.memory.total || 0)}</td>
      ${e.error ? `<td class="bad">${e.error}</td>` : ''}
    </tr>`;
  }).join('');
  const swept = res.engines.filter(e => e.sweep && e.sweep.length);
  const sweepHtml = swept.map(e => `
    <h3>${e.label} · ${e.sweep[0].knob} 扫描</h3>
    <table><thead><tr><th class="n">${e.sweep[0].knob}</th><th class="n">召回率</th><th class="n">平均延迟</th><th>趋势</th></tr></thead><tbody>
      ${e.sweep.map(s => {
        const maxR = Math.max(...e.sweep.map(x => x.recall), 0.01);
        const maxM = Math.max(...e.sweep.map(x => x.mean_ms), 0.001);
        return `<tr>
          <td class="n">${s.value}</td>
          <td class="n ${recallClass(s.recall)}">${fmtPct(s.recall)}</td>
          <td class="n">${fmtMs(s.mean_ms)} ms</td>
          <td><div style="display:flex;gap:4px;align-items:center">
            <span class="muted" style="font-size:11px;width:34px">召回</span>
            <div style="flex:1;background:var(--bg);height:8px;border-radius:2px">
              <div style="width:${s.recall/maxR*100}%;height:100%;background:var(--ok);border-radius:2px"></div></div>
            <span class="muted" style="font-size:11px;width:34px">延迟</span>
            <div style="flex:1;background:var(--bg);height:8px;border-radius:2px">
              <div style="width:${s.mean_ms/maxM*100}%;height:100%;background:var(--pink);border-radius:2px"></div></div>
          </div></td>
        </tr>`;
      }).join('')}
    </tbody></table>`).join('');

  $('#benchOut').classList.remove('hidden');
  $('#benchOut').innerHTML = `
    <div class="note">共 <b>${res.dataset.count}</b> 点 / <b>${res.dataset.dim}</b> 维 /
      <b>${res.dataset.queries}</b> 条查询 / k=<b>${res.dataset.k}</b>，
      结构 <b>${res.dataset.kind}</b>，seed <b>${res.dataset.seed}</b>（可复现）</div>
    <table style="margin-top:11px"><thead><tr>
      <th>引擎</th><th class="n">召回率</th><th class="n">门槛召回</th>
      <th class="n">构建 ms</th><th class="n">均值 ms</th><th class="n">p95 ms</th>
      <th class="n">p99 ms</th><th class="n">QPS</th><th class="n">距离/查询</th><th class="n">内存</th>
    </tr></thead><tbody>${rows}</tbody></table>
    ${sweepHtml}
    ${res.warnings.length ? `<div class="note warn">${res.warnings.join('<br>')}</div>` : ''}`;
}

/* ---------- 5. 图表 ---------- */
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
  state.tab = b.dataset.tab; draw();
});

function draw() {
  const svg = $('#svg');
  if (state.tab === 'recall')     drawScatter(svg);
  else if (state.tab === 'memory') drawMemory(svg);
  else                             drawLayers(svg);
}

function clearSvg(svg) { while (svg.firstChild) svg.removeChild(svg.firstChild); }
function el(tag, attrs, text) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text !== undefined) n.textContent = text;
  return n;
}

function drawScatter(svg) {
  clearSvg(svg);
  const W = 900, H = 320, L = 62, R = 30, T = 22, B = 46;
  if (!state.bench) {
    svg.appendChild(el('text', {x:W/2, y:H/2, fill:'#6e7681', 'text-anchor':'middle', 'font-size':'13'},
      '先在第 4 步跑一次基准评测'));
    return;
  }
  const engs = state.bench.result.engines.filter(e => !e.error);
  const pts = engs.map(e => ({ label:e.label, key:e.engine,
    x:e.latency.mean_ms, recall:e.recall, thr:e.threshold_recall }));
  // sweep 的点也画出来，才能看出曲线形状
  engs.forEach(e => (e.sweep||[]).forEach(s => {
    const base = e.latency.mean_ms;
    const scale = base / (e.sweep.find(x => x.value === (e.params.ef_search || e.config?.nprobe || e.params.nprobe))?.mean_ms || base);
    pts.push({ label:`${e.key}@${s.value}`, key:e.key, ghost:true,
      x:s.mean_ms * scale, recall:s.recall, thr:s.recall });
  }));

  const maxX = Math.max(...pts.map(p => p.x)) * 1.15 || 1;
  const px = (v) => L + (v / maxX) * (W - L - R);
  const py = (v) => H - B - v * (H - T - B);

  const g = (x, y, fill, r=6, opacity=1) => {
    const c = el('circle', {cx:px(x), cy:py(y), r, fill, opacity});
    svg.appendChild(c);
  };

  // 网格
  for (let i = 0; i <= 5; i++) {
    const v = i / 5;
    svg.appendChild(el('line', {x1:L, y1:py(v), x2:W-R, y2:py(v), stroke:'#21262d'}));
    svg.appendChild(el('text', {x:L-8, y:py(v)+4, fill:'#6e7681', 'text-anchor':'end', 'font-size':'11'},
      (v*100).toFixed(0)+'%'));
  }
  for (let i = 0; i <= 4; i++) {
    const v = maxX * i / 4;
    svg.appendChild(el('line', {x1:px(v), y1:T, x2:px(v), y2:H-B, stroke:'#21262d'}));
    svg.appendChild(el('text', {x:px(v), y:H-B+16, fill:'#6e7681', 'text-anchor':'middle', 'font-size':'11'},
      v.toFixed(2)+'ms'));
  }
  svg.appendChild(el('line', {x1:L, y1:T, x2:L, y2:H-B, stroke:'#30363d'}));
  svg.appendChild(el('line', {x1:L, y1:H-B, x2:W-R, y2:H-B, stroke:'#30363d'}));
  svg.appendChild(el('text', {x:(L+W-R)/2, y:H-14, fill:'#8b949e', 'text-anchor':'middle', 'font-size':'11'},
    '平均查询延迟（越低越好）→'));
  svg.appendChild(el('text', {x:16, y:T+4, fill:'#8b949e', 'font-size':'11'}, '召回率'));

  const colors = { brute:'#58a6ff', hnsw:'#3fb950', ivfpq:'#bc8cff' };
  pts.forEach(p => {
    const c = colors[p.key] || '#f778ba';
    // 门槛召回用空心圈，两者差距一眼可见
    if (Math.abs(p.thr - p.recall) > 0.02) {
      svg.appendChild(el('circle', {cx:px(p.x), cy:py(p.thr), r:p.ghost?5:9,
        fill:'none', stroke:c, 'stroke-width':1.4, 'stroke-dasharray':'3,2', opacity:.85}));
    }
    g(p.x, p.recall, c, p.ghost?4:7, p.ghost?0.55:1);
  });
  // 标注
  engs.forEach(e => {
    const t = el('text', {x:px(e.latency.mean_ms)+12, y:py(e.recall)+4,
      fill:'#e6edf3', 'font-size':'11.5'}, e.label);
    svg.appendChild(t);
  });
  // 图例：实心=标准召回，虚线=门槛召回
  svg.appendChild(el('text', {x:W-R-6, y:T+14, fill:'#6e7681', 'text-anchor':'end', 'font-size':'10.5'},
    '实心点 = 标准召回 · 虚线圈 = 门槛召回'));
}

function drawMemory(svg) {
  clearSvg(svg);
  const W = 900, H = 320;
  const mems = [];
  if (state.bench) {
    // 基准结果已经含了三个引擎的内存，优先用它 —— 同一张图里横向对比才有意义
    state.bench.result.engines.forEach(e => {
      if (!e.error && e.memory && e.memory.total) mems.push({ label:e.label, key:e.engine, m:e.memory });
    });
  } else {
    // 没有基准时，把已建过的所有引擎的快照都画出来
    for (const [eng, snap] of Object.entries(state.snapshots)) {
      if (snap && snap.memory && snap.memory.total) mems.push({ label:eng, key:eng, m:snap.memory });
    }
  }
  if (!mems.length) {
    svg.appendChild(el('text', {x:W/2, y:H/2, fill:'#6e7681', 'text-anchor':'middle', 'font-size':'13'},
      '先构建索引或跑一次基准'));
    return;
  }
  const max = Math.max(...mems.map(x => x.m.total)) * 1.12;
  const colors = { brute:'#58a6ff', hnsw:'#3fb950', ivfpq:'#bc8cff' };
  const parts = ['vectors','links','level_table','compressed_codes','codebooks','coarse_centroids','inverted_lists'];
  const partColors = { vectors:'#58a6ff', links:'#3fb950', level_table:'#6e7681',
    compressed_codes:'#bc8cff', codebooks:'#d29922', coarse_centroids:'#39c5cf', inverted_lists:'#f778ba' };

  let y = 34;
  mems.forEach(item => {
    let x = 70;
    const total = Math.max(item.m.total, 1);
    svg.appendChild(el('text', {x:64, y:y+4, fill:'#e6edf3', 'text-anchor':'end', 'font-size':'12'}, item.label));
    parts.forEach(p => {
      const v = item.m[p];
      if (!v) return;
      const w = (v / total) * (W - 150);
      svg.appendChild(el('rect', {x, y:y-11, width:Math.max(w,0.6), height:22,
        fill:partColors[p] || '#888', opacity:.85}));
      if (w > 46) {
        svg.appendChild(el('text', {x:x+w/2, y:y+4, fill:'#0d1117', 'text-anchor':'middle',
          'font-size':'10', 'font-weight':'600'}, p));
      }
      x += w;
    });
    svg.appendChild(el('text', {x:x+8, y:y+4, fill:'#8b949e', 'font-size':'11'},
      (item.m.total/1024).toFixed(1)+' KB'));
    y += 42;
  });
  // 图例
  let lx = 70;
  svg.appendChild(el('text', {x:64, y:H-24, fill:'#6e7681', 'text-anchor':'end', 'font-size':'11'}, '构成'));
  parts.forEach(p => {
    svg.appendChild(el('rect', {x:lx, y:H-32, width:11, height:11, fill:partColors[p]}));
    svg.appendChild(el('text', {x:lx+15, y:H-23, fill:'#8b949e', 'font-size':'10.5'}, p));
    lx += 14 + p.length * 6.4;
  });
}

function drawLayers(svg) {
  clearSvg(svg);
  const W = 900, H = 320;
  const s = state.snapshots.hnsw;
  if (!s) {
    svg.appendChild(el('text', {x:W/2, y:H/2, fill:'#6e7681', 'text-anchor':'middle', 'font-size':'13'},
      '先在第二步构建一个 HNSW 索引'));
    return;
  }
  const lv = s.nodes_per_level;
  const max = Math.max(...lv);
  const barW = W - 160;
  let y = 40;
  const step = Math.min(46, (H - 90) / Math.max(lv.length, 1));
  lv.slice().reverse().forEach((n, i) => {
    const layer = lv.length - 1 - i;
    const w = (n / max) * barW;
    const label = layer === 0 ? '第 0 层（全体 ×2m 边）' : `第 ${layer} 层（仅 ${s.config.m} 边）`;
    svg.appendChild(el('text', {x:150, y:y+4, fill:'#e6edf3', 'text-anchor':'end', 'font-size':'11.5'}, label));
    svg.appendChild(el('rect', {x:158, y:y-9, width:Math.max(w,2), height:18,
      fill: layer===0 ? '#3fb950' : '#58a6ff', opacity:0.85}));
    svg.appendChild(el('text', {x:158+w+8, y:y+4, fill:'#8b949e', 'font-size':'11'},
      `${n} 个（${(n/max*100).toFixed(1)}%）`));
    y += step;
  });
  svg.appendChild(el('text', {x:158, y:H-26, fill:'#6e7681', 'font-size':'11'},
    `几何衰减 mL = 1/ln(${s.config.m}) = ${s.config.level_multiplier.toFixed(4)}，`
    + `期望每上升一层剩约 1/${s.config.m} = ${(100/s.config.m).toFixed(1)}%`));
  svg.appendChild(el('text', {x:158, y:H-11, fill:'#6e7681', 'font-size':'11'},
    `实际: ${lv.map(v => (v/max*100).toFixed(0)+'%').join(' → ')} · 平均度 ${s.avg_degree_layer0}`));
}

checkHealth();
syncIndexFields();
draw();
</script>
</body>
</html>
